name: CI
on:
  push:
    branches: ["main", "dev", "feature/**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-web.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Import smoke test
        run: python -c "import app_server, api.index, core.council, core.synthesis, core.mcp_client"
      - name: No accidental secrets
        run: |
          ! grep -RInE '(sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,})' . --exclude-dir=.git --exclude='*.md'
