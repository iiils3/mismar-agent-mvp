name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: python -m compileall -q .

      - name: Secret scan
        shell: bash
        run: |
          if git grep -n -I -E '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|GROQ_API_KEY=|GEMINI_API_KEY=|OPENROUTER_API_KEY=)' -- ':!*.md'; then
            echo "Potential secret detected."
            exit 1
          fi

      - name: Required files
        run: |
          test -f orchestrator.py
          test -f run_builder.py
